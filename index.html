<!doctype html>

    <style>

      body {
        margin: 0;

      main { width: 100%; max-width: 640px; }
      h1 { margin: 0 0 16px; font-size: clamp(1.6rem, 5vw, 2.4rem); line-height: 1.35; }

  <body>
    <main>
      <h1>满舱而归 · 制作进度</h1>
